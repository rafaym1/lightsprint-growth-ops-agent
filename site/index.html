<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LightSprint Comparisons</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px; margin: 48px auto; padding: 0 20px;
    color: #1a1a1a; background: #fff;
  }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } }
  h1 { font-size: 1.4rem; margin-bottom: 0; }
  .tagline { color: #888; margin-top: 4px; margin-bottom: 32px; }
  .row { border-top: 1px solid #ddd; padding: 20px 0; }
  .row:last-child { border-bottom: 1px solid #ddd; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .cat { color: #888; font-size: 0.8rem; }
  dl { margin: 10px 0 0; }
  dt { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #888; margin-top: 10px; }
  dd { margin: 2px 0 0; }
  .meta { color: #999; font-size: 0.75rem; margin-top: 10px; }
  #loaded-from { font-size: 0.75rem; color: #999; margin-top: 40px; }
</style>
</head>
<body>
  <h1>LightSprint vs.</h1>
  <p class="tagline" id="tagline">loading&hellip;</p>
  <div id="rows"></div>
  <p id="loaded-from"></p>

<script>
async function load() {
  const res = await fetch("../data/comparisons.json");
  const data = await res.json();
  document.getElementById("tagline").textContent = data.tagline + " · last updated " + data.last_updated;
  const rows = document.getElementById("rows");
  for (const c of data.competitors) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="name">${c.name} <span class="cat">${c.category}</span></div>
      <dl>
        <dt>${c.name} is stronger for</dt>
        <dd>${c.stronger_for}</dd>
        <dt>LightSprint is better for</dt>
        <dd>${c.lightsprint_better_for}</dd>
      </dl>
      <div class="meta">tracked at ${c.track_url} · last reviewed ${c.last_reviewed}</div>
    `;
    rows.appendChild(row);
  }
  document.getElementById("loaded-from").textContent =
    "This page renders data/comparisons.json directly -- the same file the growth-ops agent opens PRs against.";
}
load();
</script>
</body>
</html>
